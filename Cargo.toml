[workspace]
members = ["scopedb-client", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
homepage = "https://www.scopedb.io"
license = "Apache-2.0"
repository = "https://github.com/scopedb/scopedb-client"
rust-version = "1.91.0"

[workspace.dependencies]
anyhow = { version = "1.0.104" }
cargo_metadata = { version = "0.23.1" }
clap = { version = "4.6.6" }
fastrace = { version = "0.7.19" }
fastrace-reqwest = { version = "0.3.0" }
hex = { version = "0.4.3" }
httpdate = { version = "1.0.3" }
jiff = { version = "0.2.35", features = ["serde"] }
mea = { version = "0.6.7" }
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "query",
  "rustls",
  "charset",
  "http2",
  "gzip",
  "zstd",
  "system-proxy",
] }
semver = { version = "1.0.28" }
serde = { version = "1.0.229" }
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
ureq = { version = "3.4.0", default-features = false }
uuid = { version = "1.25.0", features = ["v7", "serde"] }
which = { version = "8.0.5" }
zstd = { version = "0.13.3" }

[workspace.lints.rust]
unknown_lints = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
field_reassign_with_default = "allow"
identity_op = "allow"
manual_range_contains = "allow"
new_without_default = "allow"
