name: Release (Rust SDK)
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: release-rust-sdk
  cancel-in-progress: false

jobs:
  ci:
    name: Validate release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit(f"Expected a stable release tag vX.Y.Z, got {tag!r}")
          manifest = tomllib.loads(Path("scopedb-client/Cargo.toml").read_text())
          version = manifest["package"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match crate version {version!r}")
          changelog = Path("CHANGELOG.md").read_text()
          if not re.search(rf"^## {re.escape(tag)} \(\d{{4}}-\d{{2}}-\d{{2}}\)$", changelog, re.MULTILINE):
              raise SystemExit(f"Missing dated changelog entry for {tag}")
          PY
      - name: Install stable toolchain for compatibility checks
        uses: dtolnay/rust-toolchain@stable
      - name: Install minimum supported toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Check release compatibility
        run: cargo +1.91.0 x semver --release-version "${GITHUB_REF_NAME#v}"
      - name: Verify package
        run: |
          cargo +1.91.0 publish --package scopedb-client --dry-run --locked
          cargo +1.91.0 package --package scopedb-client --list --locked
          git diff --exit-code
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate
        run: cargo +1.91.0 publish --package scopedb-client --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
